# Run ThreatWatch locally in Docker:
#   docker compose up --build        ->  http://localhost:5000  (Swagger: /apidocs/)
#   docker compose down
# Uses your .env (MONGO_URI for Atlas, SMTP, Firebase) if present; without it the app
# falls back to an in-memory database so it still starts.

services:
  threatwatch:
    build: .
    image: threatwatch:latest
    container_name: threatwatch
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
      SEED_DEMO: "1"
      REPLAY: "1"
      WEB_CONCURRENCY: "1"
    restart: unless-stopped
